[project]
name = "collabshell"
version = "1.0.0"
description = "Collab Shell: Client for Google Colab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.85.3",
    "flet-ads>=0.85.0",
    "flet-xterm",
    "google-colab-cli>=0.6.0",
]

[tool.flet]
org = "ng.kiri"
product = "Collab Shell"
build_number = 1

[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
flet-xterm = "../flet-xterm"

[tool.flet.app.boot_screen]
show = true
message = "Initializing Collab Shell..."

[tool.flet.android]
bundle_id = "ng.kiri.collabshell"
split_per_abi = true
min_sdk_version = 24
target_sdk_version = 35

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~1261089274"

[tool.flet.android.manifest_application]
allowBackup = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.signing]
key_store = "/home/onyii/Desktop/kiri-apps/Colab/kiri_keystore.jks"
key_alias = "upload"



[dependency-groups]
dev = [
    "ruff",
]

[tool.uv.sources]
flet-xterm = { path = "../flet-xterm", editable = true }

