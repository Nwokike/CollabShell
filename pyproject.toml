[project]
name = "collabshell"
version = "2.2.0"
description = "Collab Shell: Notebook and TTY client for Google Colab"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet==1.0.4",
    "flet-ads==1.0.4",
    "httpx>=0.28.1",
    "flet-cli==1.0.4; sys_platform == 'win32'",
    "flet-desktop==1.0.4; sys_platform == 'win32'",
    "flet-terminal==0.3.9",
    "google-colab-cli==0.7.4",
    # google-colab-cli imports jupyter_kernel_client.JupyterSubprotocol
    # (colab_cli/runtime.py:55), which 1.0.0 renamed. Pin below 1.0 until
    # colab_cli supports the new API. The local uv.lock resolves 0.9.0 either
    # way, but the Android/desktop builds re-resolve from this file, and an
    # unpinned 1.x there fails the whole build with ResolutionImpossible.
    "jupyter-kernel-client<1.0",
    "rich>=15.0.0",
    "flet-notifications>=0.1.4",
    "kani[openai]>=1.10.0",
]

[tool.flet]
org = "ng.kiri"
product = "Colab Shell"
build_number = 13

[tool.flet.app]
path = "src"


[tool.flet.boot_screen]
startup_message = "Initializing Collab Shell..."

[tool.flet.android]
bundle_id = "ng.kiri.collabshell"

# Google Play requires 16 KB ELF page alignment on 64-bit ABIs; pyzmq's
# android x86_64 wheel ships 4 KB-aligned libs (libzmq + libc++_shared), so
# x86_64 is dropped.
#
# armeabi-v7a is dropped for a different, harder reason: there is NO armv7
# wheel for pyzmq at all (0 armv7, 15 aarch64, 0 pure-Python on PyPI), and
# pyzmq arrives via kani/jupyter-kernel-client -> jupyter-client. `flet build`
# installs the deps per ABI with `--only-binary :all:`, so it cannot compile
# pyzmq from source, and the whole 32-bit install dies with
# `ResolutionImpossible`. So armeabi-v7a is not a choice we can make: it
# cannot be built with the current dependency set. arm64-v8a is the ABI every
# current Android device uses.
target_arch = ["arm64-v8a"]

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~7138516733"

[tool.flet.android.manifest_application]
allowBackup = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"



[dependency-groups]
dev = [
    "pytest",
    "ruff",
]



[tool.ruff]
lint.extend-ignore = ["BLE001", "S110"]

