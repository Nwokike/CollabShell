[project]
name = "collabshell"
version = "2.2.0"
description = "Collab Shell: Notebook and TTY client for Google Colab"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.1",
    "flet-ads>=1.0.1",
    "httpx>=0.28.1",
    "flet-cli>=1.0.1; sys_platform == 'win32'",
    "flet-desktop>=1.0.1; sys_platform == 'win32'",
    "flet-terminal>=0.3.9",
    "google-colab-cli>=0.7.2",
    # Android builds package with Python 3.14 and resolve these fresh inside
    # the APK (uv.lock does not apply there). These versions exist as Android
    # wheels only on flet's mobile index, where they are published as PEP 440
    # post-releases — hence the explicit .postN pins. The latest releases on
    # PyPI (pydantic-core 2.46.5, pyarrow 25.0.1, rpds-py 2026.6.3,
    # cryptography 50.0.1) ship no Android wheels at all. pyarrow arrives via
    # jupyter-mimetypes, which leaves it unpinned upstream.
    "pydantic==2.13.4",
    "rpds-py==2026.5.1",
    "cryptography==48.0.0",
    "pyarrow==24.0.0",
    "rich>=15.0.0",
    "flet-local-auth>=1.0.1",
]

[tool.flet]
org = "ng.kiri"
product = "Colab Shell"
build_number = 13

[tool.flet.app]
path = "src"


[tool.flet.app.boot_screen]
startup_message = "Initializing Collab Shell..."

[tool.flet.android]
bundle_id = "ng.kiri.collabshell"

# Google Play requires 16 KB ELF page alignment on 64-bit ABIs; pyzmq 27.2.0's
# android x86_64 wheel ships 4 KB-aligned libs (libzmq + libc++_shared), so
# x86_64 is dropped. armeabi-v7a is also dropped: google-colab-cli pulls
# jupyter-mimetypes → pyarrow, and flet's mobile index carries no
# armeabi-v7a pyarrow wheel for any version, so a 32-bit APK cannot resolve
# its dependency tree. Play requires 64-bit for updates regardless.
target_arch = ["arm64-v8a"]

# Native wheels in the dependency tree (pydantic-core, pyzmq, cryptography,
# rpds) are extracted next to the app instead of read from the zipped
# site-packages.
extract_packages = ["pydantic_core", "pyzmq", "cryptography", "_cffi_backend", "rpds"]

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~7138516733"

[tool.flet.android.manifest_application]
allowBackup = "false"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true

[tool.flet.android.signing]
key_store = "../../../../kiri_keystore.jks"
key_alias = "upload"



[dependency-groups]
dev = [
    "pytest",
    "ruff",
]



[tool.uv]
# TODO(upstream): google-colab-cli 0.7.2 pins jupyter-kernel-client==0.8.0,
# but its own ws dispatcher (runtime._apply_ws_hook) imports symbols that only
# exist in the 0.9-0.15 era (wsclient.JupyterSubprotocol,
# deserialize_msg_from_ws_default, _subprotocol) — so Drive-OAuth
# colab_request interception is dead on the pin (verified: ImportError on
# 0.8.0). 0.15.0 is pre-rename (KernelClient still exists) and colab_cli's
# dual-client support handles ColabKernelClient. Drop this override the moment
# upstream widens the pin (googlecolab/google-colab-cli#138). Android builds
# still package 0.8.0 until that PR lands — same as every previous release.
override-dependencies = ["jupyter-kernel-client==0.15.0"]

[tool.ruff]
# Pinned to 3.12, NOT the 3.14 that requires-python implies: the formatter
# otherwise rewrites `except (A, B):` into the 3.14-only unparenthesized
# form, which flet's Android packaging (CPython 3.12) refuses to compile —
# it has silently broken the mobile build twice.
target-version = "py312"
lint.extend-ignore = ["BLE001", "S110"]

